<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Weather Information System</title>
</head>

<body>

    <!-- Main title -->
    <h1>Weather Information System</h1>

    <!-- Search form -->
    <form action="/weather" method="get">

        <input
            type="text"
            name="location"
            placeholder="Aurora, IL"
            required
        >

        <button type="submit">
            Get Weather
        </button>

    </form>


    <!-- Error message -->
    <div th:if="${error != null}">

        <p th:text="${error}"></p>

    </div>


    <!-- Location information -->
    <div th:if="${coordinates != null}">

        <h2 th:text="${search}"></h2>

        <p>
            Latitude:
            <span th:text="${coordinates.latitude}"></span>
        </p>

        <p>
            Longitude:
            <span th:text="${coordinates.longitude}"></span>
        </p>

    </div>


    <!-- Current weather conditions -->
    <section th:if="${currentWeather != null}">

        <h2>Current Conditions</h2>

        <!-- Current weather description -->
        <p>
            Conditions:
            <strong th:text="${currentWeather.description}"></strong>
        </p>

        <!-- Current temperature -->
        <p>
            Temperature:

            <strong
                th:if="${currentWeather.temperature != null}"
                th:text="|${#numbers.formatDecimal(currentWeather.temperature, 1, 1)}°F|">
            </strong>

            <span
                th:if="${currentWeather.temperature == null}">
                N/A
            </span>
        </p>

        <!-- Current humidity -->
        <p>
            Humidity:

            <strong
                th:if="${currentWeather.humidity != null}"
                th:text="|${#numbers.formatDecimal(currentWeather.humidity, 1, 1)}%|">
            </strong>

            <span
                th:if="${currentWeather.humidity == null}">
                N/A
            </span>
        </p>

        <!-- Current wind speed -->
        <p>
            Wind:

            <strong
                th:if="${currentWeather.windSpeed != null}"
                th:text="|${#numbers.formatDecimal(currentWeather.windSpeed, 1, 1)} mph|">
            </strong>

            <span
                th:if="${currentWeather.windSpeed == null}">
                N/A
            </span>
        </p>

        <!-- Observation station -->
        <p>
            Observation Station:
            <span th:text="${currentWeather.stationName}"></span>
        </p>

    </section>


    <!--
        Display this message if current observations fail,
        while still allowing the normal forecast to appear.
    -->
    <div th:if="${currentWeatherError != null}">

        <p th:text="${currentWeatherError}"></p>

    </div>


    <!-- Today's shorter forecast -->
    <section
        th:if="${todayForecast != null and !todayForecast.isEmpty()}">

        <h2>Today's Forecast</h2>

        <!--
            Only loops through forecast periods belonging
            to the current forecast date.
        -->
        <div th:each="period : ${todayForecast}">

            <!-- Period name such as "Today" or "Tonight" -->
            <h3 th:text="${period.name}"></h3>

            <!-- NWS weather icon -->
            <img
                th:src="${period.icon}"
                th:alt="${period.shortForecast}"
            >

            <!-- Forecast temperature -->
            <p>
                <strong>
                    <span th:text="${period.temperature}"></span>°
                    <span th:text="${period.temperatureUnit}"></span>
                </strong>
            </p>

            <!-- Brief weather description -->
            <p th:text="${period.shortForecast}"></p>

            <!-- Forecast wind -->
            <p>
                Wind:
                <span th:text="${period.windSpeed}"></span>
                <span th:text="${period.windDirection}"></span>
            </p>

        </div>

    </section>


    <!--
        Full forecast is hidden by default.

        Clicking "Show Full Forecast" expands this section.

        This uses the normal HTML <details> element, so
        no JavaScript is required.
    -->
    <details
        th:if="${forecast != null and !forecast.isEmpty()}">

        <summary>
            Show Full Forecast
        </summary>

        <div th:each="period : ${forecast}">

            <h3 th:text="${period.name}"></h3>

            <!-- NWS weather icon -->
            <img
                th:src="${period.icon}"
                th:alt="${period.shortForecast}"
            >

            <!-- Temperature -->
            <p>
                Temperature:
                <span th:text="${period.temperature}"></span>°
                <span th:text="${period.temperatureUnit}"></span>
            </p>

            <!-- Short forecast -->
            <p th:text="${period.shortForecast}"></p>

            <!-- Wind -->
            <p>
                Wind:
                <span th:text="${period.windSpeed}"></span>
                <span th:text="${period.windDirection}"></span>
            </p>

            <!-- Full detailed forecast -->
            <p th:text="${period.detailedForecast}"></p>

            <hr>

        </div>

    </details>

</body>

</html>
